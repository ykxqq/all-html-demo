  <div class="nav prev" id="zprev"></div>
  <div class="nav next" id="znext"></div>
<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  const N = slides.length;
  let idx = 0;
  const deck = document.getElementById('deck');
  const cur = document.getElementById('cur');
  const dotsWrap = document.getElementById('dots');
  slides.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'+(i===0?' on':''); d.onclick=()=>go(i); dotsWrap.appendChild(d); });
  const dots = Array.from(document.querySelectorAll('.dot'));

  function scale() {
    const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
    deck.style.transform = 'scale(' + s + ')';
  }
  function go(i) {
    idx = Math.max(0, Math.min(N-1, i));
    slides.forEach((s,j)=> s.classList.toggle('active', j===idx));
    dots.forEach((d,j)=> d.classList.toggle('on', j===idx));
    cur.textContent = idx+1;
    try { localStorage.setItem('geo_deck_idx', idx); } catch(e){}
  }
  function next(){ go(idx+1); } function prev(){ go(idx-1); }
  document.getElementById('nx').onclick = (e)=>{e.stopPropagation();next();};
  document.getElementById('pv').onclick = (e)=>{e.stopPropagation();prev();};
  document.getElementById('znext').onclick = next;
  document.getElementById('zprev').onclick = prev;
  document.getElementById('fs').onclick = (e)=>{ e.stopPropagation();
    if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
  window.addEventListener('keydown', e=>{
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}
    else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  window.addEventListener('resize', scale);
  try { const saved=parseInt(localStorage.getItem('geo_deck_idx')); if(!isNaN(saved)) idx=Math.min(saved,N-1); } catch(e){}
  scale(); go(idx);
</script>
