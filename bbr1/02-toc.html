<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P2 · 目录</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .layout { display: grid; grid-template-columns: 1.4fr 1fr; height: 100%; }
  .left { padding: 130px 80px 110px 120px; display: flex; flex-direction: column; justify-content center; }
  .header-row { display: flex; align-items: center; gap: 20px; margin-bottom: 60px; }
  .header-row .cn { font-family: 'Noto Serif SC', serif; font-size: 56px; color: var(--brown-dark); font-weight: 700; }
  .header-row .en { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); letter-spacing: 0.36em; }
  .header-row .deco-line { flex: 1; height: 1px; background: var(--gold); opacity: 0.4; }

  .toc-list { display: flex; flex-direction: column; gap: 26px; }
  .toc-item {
    display: grid; grid-template-columns: 92px 1fr; gap: 30px;
    align-items: baseline; padding: 14px 0; position: relative;
  }
  .toc-item::before {
    content: ""; position: absolute; left: 0; top: 50%;
    width: 1px; height: 64px; background: var(--gold);
    transform: translateY(-50%); opacity: 0.7;
  }
  .toc-num {
    font-family: 'Playfair Display', serif;
    font-size: 42px; color: var(--gold); font-weight: 600;
    letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    padding-left: 18px;
  }
  .toc-text { display: flex; flex-direction: column; gap: 4px; }
  .toc-cn {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px; color: var(--brown-dark); font-weight: 700; letter-spacing: 0.04em;
  }
  .toc-en {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; color: rgba(74,74,74,0.55);
    letter-spacing: 0.28em; text-transform: uppercase;
  }
  .toc-desc { font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: var(--text-body); margin-top: 4px; }

  .right {
    position: relative; overflow: hidden;
  }
  .right img { width: 100%; height: 100%; object-fit: cover; }
  .right::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--cream) 0%, rgba(245,239,230,0) 18%);
    z-index: 2;
  }
</style>
</head>
<body>
<section class="slide">
  <div class="top-nav">
    <div class="brand-mark">BURBERRY</div>
    <div class="nav-links">
      <span>HOME</span><span class="active">CASE</span><span>STRATEGY</span><span>VALUE</span><span>ABOUT</span>
    </div>
  </div>

  <div class="layout">
    <div class="left">
      <div class="header-row">
        <div class="cn">目录</div>
        <div class="en">CONTENTS</div>
        <div class="deco-line"></div>
      </div>

      <div class="toc-list">
        <div class="toc-item">
          <div class="toc-num">01</div>
          <div class="toc-text">
            <div class="toc-cn">品牌痛点 <span style="font-size:18px;color:var(--camel);margin-left:8px;">Brand Pain Point</span></div>
            <div class="toc-desc">奢侈品夏季运营的"不可能"</div>
          </div>
        </div>
        <div class="toc-item">
          <div class="toc-num">02</div>
          <div class="toc-text">
            <div class="toc-cn">核心策略 <span style="font-size:18px;color:var(--camel);margin-left:8px;">Core Strategy</span></div>
            <div class="toc-desc">做品牌与用户的"价值翻译官"</div>
          </div>
        </div>
        <div class="toc-item">
          <div class="toc-num">03</div>
          <div class="toc-text">
            <div class="toc-cn">合作亮点 <span style="font-size:18px;color:var(--camel);margin-left:8px;">Cooperation Highlights</span></div>
            <div class="toc-desc">找到对的人，构建"值"认知</div>
          </div>
        </div>
        <div class="toc-item">
          <div class="toc-num">04</div>
          <div class="toc-text">
            <div class="toc-cn">范式沉淀 <span style="font-size:18px;color:var(--camel);margin-left:8px;">Paradigm Precipitation</span></div>
            <div class="toc-desc">可复制的奢品增长模型</div>
          </div>
        </div>
      </div>
    </div>

    <div class="right">
      <img src="../assets/img/check-scarf.jpg" alt="Burberry Scarf">
    </div>
  </div>

  <div class="foot-deco">
    <div class="page-num">02 / 18</div>
    <div class="line"></div>
    <div class="label">SMZDM × BURBERRY · 618</div>
  </div>
</section>
</body>
</html>
