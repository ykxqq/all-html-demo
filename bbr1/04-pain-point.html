<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P4 · 品牌痛点</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .layout { display: grid; grid-template-columns: 1.4fr 1fr; height: 100%; padding: 0 0 0 0; }
  .left { padding: 130px 60px 100px 120px; display: flex; flex-direction: column; justify-content center; gap: 30px; }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-family: 'Playfair Display', serif;
    font-size: 13px; color: var(--gold); letter-spacing: 0.34em; text-transform: uppercase;
  }
  .eyebrow .bar { width: 36px; height: 1px; background: var(--gold); }
  .title-cn { font-family: 'Noto Serif SC', serif; font-size: 48px; color: var(--brown-dark); font-weight: 700; line-height: 1.18; letter-spacing: 0.02em; }
  .title-en { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--camel); letter-spacing: 0.32em; text-transform: uppercase; margin-top: -8px; }

  .problem-card { background: var(--white); border-radius: 14px; padding: 28px 30px; box-shadow: 0 12px 30px rgba(61,43,31,0.06); }
  .problem-card .h { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--brown-dark); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  .problem-card .h::before { content: ""; width: 28px; height: 1px; background: var(--gold); }
  .problem-card p { font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: var(--text-body); line-height: 1.9; }
  .problem-card strong { color: var(--brown-dark); }

  .quote-mark {
    font-family: 'Playfair Display', serif;
    font-size: 120px; color: var(--gold); opacity: 0.18;
    line-height: 0.6; margin-top: 6px;
  }

  .right {
    padding: 130px 100px 100px 30px; display: flex; flex-direction: column; gap: 28px; justify-content: center;
  }
  .right .img-frame { aspect-ratio: 1/1.05; }
  .right .img-frame img { object-fit: cover; }
  .right .img-label {
    display: flex; align-items: center; gap: 12px; font-family: 'Montserrat', sans-serif;
    font-size: 11px; color: var(--text-body); letter-spacing: 0.28em; text-transform: uppercase; padding-left: 6px;
  }
  .right .img-label .num { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 18px; }
</style>
</head>
<body>
<section class="slide">
  <div class="top-nav">
    <div class="brand-mark">BURBERRY</div>
    <div class="nav-links"><span>HOME</span><span class="active">CASE</span><span>STRATEGY</span><span>VALUE</span><span>ABOUT</span></div>
  </div>

  <div class="layout">
    <div class="left">
      <div>
        <div class="eyebrow"><span class="bar"></span>THE IMPOSSIBILITY OF LUXURY SUMMER OPERATION</div>
        <div class="title-cn" style="margin-top:14px;">奢侈品夏季运营的<br>"不可能"</div>
      </div>

      <div class="problem-card">
        <div class="h">核心矛盾</div>
        <p>618 夏季大促 vs 品牌核心爆款集中在秋冬，夏季成<strong>"运营空窗期"</strong>。</p>
      </div>

      <div class="problem-card">
        <div class="h">认知鸿沟</div>
        <p>Burberry 最具认知度的经典产品集中在秋冬季（风衣、羊绒围巾等），夏季难以突破<strong>"季节认知鸿沟"</strong>。</p>
      </div>

      <div class="quote-mark">"</div>
    </div>

    <div class="right">
      <div class="img-frame">
        <img src="../assets/img/trench-coat.jpg" alt="Trench Coat">
      </div>
      <div class="img-label"><span class="num">01</span><span>ICONIC CAMEL TRENCH COAT</span></div>

      <div class="img-frame" style="margin-top:6px;">
        <img src="../assets/img/check-scarf.jpg" alt="Check Scarf">
      </div>
      <div class="img-label"><span class="num">02</span><span>CHECK CASHMERE SCARF</span></div>
    </div>
  </div>

  <div class="foot-deco">
    <div class="page-num">04 / 18</div>
    <div class="line"></div>
    <div class="label">SMZDM × BURBERRY · 618</div>
  </div>
</section>
</body>
</html>
