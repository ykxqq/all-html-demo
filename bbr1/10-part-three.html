<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P10 · 章节过渡 - Part Three</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .layout { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .left { position: relative; overflow: hidden; }
  .left img { width: 100%; height: 100%; object-fit: cover; }
  .left::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(245,239,230,0) 65%, var(--cream) 100%);
  }
  .left .tag-stack {
    position: absolute; left: 40px; bottom: 40px; z-index: 4;
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 60%;
  }
  .left .tag-stack .tag {
    padding: 7px 16px; background: rgba(61,43,31,0.78); color: var(--cream);
    border-radius: 100px; font-family: 'Noto Sans SC', sans-serif; font-size: 11px; letter-spacing: 0.16em;
  }

  .right {
    padding: 0 110px; display: flex; flex-direction: column; justify-content: center; gap: 28px;
  }
  .part-line { display: flex; align-items: center; gap: 16px; }
  .part-num { font-family: 'Playfair Display', serif; font-size: 88px; color: var(--gold); line-height: 1; }
  .part-en { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--gold); font-style: italic; letter-spacing: 0.08em; }
  .title-cn { font-family: 'Noto Serif SC', serif; font-size: 72px; color: var(--brown-dark); font-weight: 700; line-height: 1.1; letter-spacing: 0.04em; }
  .title-en { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--text-body); letter-spacing: 0.36em; text-transform: uppercase; opacity: 0.7; }
  .divider { width: 64px; height: 1px; background: var(--gold); }

  .quote-block { position: relative; padding-left: 36px; }
  .quote-block::before {
    content: """; position: absolute; left: -8px; top: -36px;
    font-family: 'Playfair Display', serif; font-size: 130px; color: var(--gold); line-height: 1;
  }
  .quote-block .q {
    font-family: 'Noto Serif SC', serif; font-style: italic;
    font-size: 26px; color: var(--brown-dark); line-height: 1.6; font-weight: 500;
  }

  .dots { position: absolute; left: 110px; top: 110px; display: flex; gap: 10px; z-index: 3; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brown-dark); }
  .dot.camel { background: var(--camel); }
  .dot.cream { background: var(--cream); border: 1px solid var(--gold); }
  .burb-texture {
    position: absolute; left: 30px; top: 50%; transform: translateY(-50%);
    font-family: 'Playfair Display', serif; font-size: 90px; color: var(--gold); opacity: 0.05;
    letter-spacing: 0.08em; z-index: 1; pointer-events: none;
  }
</style>
</head>
<body>
<section class="slide">
  <div class="burb-texture">BURBERRY · BURBERRY · BURBERRY</div>
  <div class="layout">
    <div class="left">
      <img src="../assets/img/summer-lookbook.jpg" alt="Summer Lookbook">
      <div class="tag-stack">
        <div class="tag">数据驱动</div>
        <div class="tag">深度洞察</div>
        <div class="tag">专业内容</div>
      </div>
    </div>
    <div class="right">
      <div class="dots"><div class="dot"></div><div class="dot camel"></div><div class="dot cream"></div></div>
      <div class="part-line">
        <div class="part-num">03</div>
        <div class="part-en">Part Three</div>
      </div>
      <div class="title-cn">合作亮点</div>
      <div class="title-en">COOPERATION HIGHLIGHTS</div>
      <div class="divider"></div>
      <div class="quote-block">
        <div class="q">找到对的人，<br>构建"值"认知</div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
