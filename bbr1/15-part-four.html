<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P15 · 章节过渡 - Part Four</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .slide { background: var(--brown-dark); }
  .burb-texture-bg {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 220px; color: var(--gold); opacity: 0.05;
    letter-spacing: 0.08em; white-space: nowrap; pointer-events: none; z-index: 1;
  }
  .check-pattern {
    position: absolute; inset: 0; opacity: 0.04; pointer-events: none; z-index: 1;
    background-image:
      linear-gradient(45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(-45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--gold) 75%),
      linear-gradient(-45deg, transparent 75%, var(--gold) 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, 30px 0;
  }
  .center { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; padding: 0 200px; gap: 28px; text-align: center; }
  .part-line { display: flex; align-items: center; gap: 16px; }
  .part-num { font-family: 'Playfair Display', serif; font-size: 88px; color: var(--gold); line-height: 1; }
  .part-en { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--gold); font-style: italic; letter-spacing: 0.08em; }
  .title-cn { font-family: 'Noto Serif SC', serif; font-size: 72px; color: var(--cream); font-weight: 700; line-height: 1.1; letter-spacing: 0.04em; }
  .title-en { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--gold); letter-spacing: 0.36em; text-transform: uppercase; }
  .divider { width: 64px; height: 1px; background: var(--gold); }

  .formula {
    margin-top: 8px; padding: 22px 40px; border: 1px solid var(--gold); border-radius: 4px;
    display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    font-family: 'Noto Serif SC', serif; font-size: 24px; color: var(--cream);
  }
  .formula .op { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 28px; }
  .formula .term { color: var(--cream); }

  .tag-bottom {
    position: absolute; right: 110px; bottom: 110px; z-index: 4;
    padding: 8px 18px; border-radius: 100px; border: 1px solid var(--gold);
    color: var(--gold); font-family: 'Noto Sans SC', sans-serif; font-size: 12px; letter-spacing: 0.16em;
  }
  .dots { position: absolute; left: 110px; top: 110px; display: flex; gap: 10px; z-index: 3; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
  .dot.camel { background: var(--camel); }
  .dot.cream { background: var(--cream); }
</style>
</head>
<body>
<section class="slide">
  <div class="check-pattern"></div>
  <div class="burb-texture-bg">BURBERRY · BURBERRY · BURBERRY</div>

  <div class="dots"><div class="dot"></div><div class="dot camel"></div><div class="dot cream"></div></div>

  <div class="center">
    <div class="part-line">
      <div class="part-num">04</div>
      <div class="part-en">Part Four</div>
    </div>
    <div class="title-cn">范式沉淀</div>
    <div class="title-en">PARADIGM PRECIPITATION</div>
    <div class="divider"></div>

    <div class="formula">
      <span class="term">精准人群</span>
      <span class="op">×</span>
      <span class="term">价值翻译</span>
      <span class="op">×</span>
      <span class="term">全链路闭环</span>
    </div>
  </div>

  <div class="tag-bottom">可复制增长模型</div>
</section>
</body>
</html>
